<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強調と改行</title>
</head>
<body>
                    <!-- 太文字 -->
    <p>本日は<strong>送料無料</strong>です。</p>
                    <!-- 斜体 -->
    <p>お届けは<em>3日後</em>になります</p>
                    <!-- 改行 -->
    <p>大阪府大阪市<br>中央区1-1</p>

</body>
</html>
