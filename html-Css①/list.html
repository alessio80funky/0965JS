<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リスト</title>
</head>
<body>
    <!-- ul = unordered list  整理されていないリスト -->
    <ul>
        <li>りんご</li>
        <li>みかん</li>
    </ul>
    <!-- ol = ordered list 整理されているリスト　-->
    <ol>
        <li>材料を切る</li>
        <li>炒める</li>
        <li>揚げる</li>
    </ol>
</body>
</html>
