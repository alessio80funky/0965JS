<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テーブル(表)</title>
</head>
<body>

    <table>
         <!-- tr = table row -->
     <tr>  
        <!-- th = table header  -->
            <th>サイズ</th><th>値段</th>

            <!-- td = table data -->
            <td>5Kg</td><td>2000円</td>
        </tr>
    </table>
    
</body>
</html>
